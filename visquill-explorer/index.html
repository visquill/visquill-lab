<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VisQuill Lab — interactive demos and reusable components built with the VisQuill GDK">
  <title>VisQuill Lab</title>
</head>
<body>
<div class="demo-viewer">
  <aside class="sidebar">
    <h1 id="home-button" class="home-button">VisQuill Lab</h1>
    <div id="demo-list"></div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="header-info">
        <h2 id="title">Select a demo</h2>
        <span id="category" class="category"></span>
      </div>

      <a class="github-link" href="https://github.com/visquill/visquill-lab" target="_blank" rel="noopener">
        <svg class="github-icon" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor" width="16" height="16">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
            -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
            .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
            -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
            .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
            .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
            0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        <span class="github-label">visquill-lab</span>
      </a>

      <div class="tabs">
        <button class="tab active" data-tab="both">Both</button>
        <button class="tab" data-tab="preview">Canvas</button>
        <button class="tab" data-tab="source">Source</button>
      </div>
    </header>

    <section class="content">
      <!-- Preview-only panel -->
      <div id="preview-panel" class="panel preview-panel">
        <div class="preview-stage" id="preview-stage"></div>
      </div>

      <!-- Source-only panel -->
      <div id="source-panel" class="panel source-panel">
        <div class="source-wrapper">
          <div class="file-tabs" id="file-tabs-source"></div>
          <div class="source-container" id="source-container-source"></div>
        </div>
      </div>

      <!-- Both panel (split view) -->
      <div id="both-panel" class="panel both-panel active">
        <div class="preview-stage" id="both-stage"></div>
        <div class="resizer" id="resizer"></div>
        <div class="source-wrapper">
          <div class="file-tabs" id="file-tabs-both"></div>
          <div class="source-container" id="source-container-both"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script type="module" src="./src/explorer.ts"></script>
</body>
</html>
